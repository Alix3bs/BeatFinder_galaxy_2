<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="planet" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#8be9ff"/>
      <stop offset="45%" stop-color="#7b2ff7"/>
      <stop offset="100%" stop-color="#1b0648"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#f107a3"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="17" fill="url(#planet)"/>
  <!-- waveform across the planet -->
  <path d="M20 32h3l2-6 3 12 3-16 3 20 3-14 2 4h5"
        stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- orbit ring -->
  <ellipse cx="32" cy="32" rx="27" ry="9.5" stroke="url(#ring)" stroke-width="2"
           transform="rotate(-18 32 32)" opacity="0.9"/>
  <circle cx="55" cy="22" r="2.4" fill="#00e5ff"/>
  <circle cx="10" cy="44" r="1.6" fill="#f107a3"/>
</svg>
