<title>TopNotch — South Florida</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{
    --bg:#0F130E;
    --shell:#121711;
    --card:#1A211A;
    --card-2:#212A21;
    --line:#2C362B;
    --ink:#EDE6D6;
    --ink-2:#A8AE9B;
    --ink-3:#6F7565;
    --accent:#F0603F;
    --accent-ink:#16100D;
    --good:#8FBF7F;
    --good-dim:rgba(143,191,127,.14);
    --warn:#E0B34E;
    --bad:#E06A5A;
    --display:'Didot','Bodoni MT','Bodoni 72','Playfair Display','Georgia Pro',Georgia,serif;
    --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    --mono:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#E6E3D8; --shell:#EFECE1; --card:#FFFFFF; --card-2:#F3F0E6;
      --line:#D8D4C4; --ink:#1B2117; --ink-2:#5C6152; --ink-3:#8B9080;
      --accent:#C24A2A; --accent-ink:#FFF6EF;
      --good:#3E7A38; --good-dim:rgba(62,122,56,.10); --warn:#8F6B14; --bad:#B2402F;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F130E; --shell:#121711; --card:#1A211A; --card-2:#212A21;
    --line:#2C362B; --ink:#EDE6D6; --ink-2:#A8AE9B; --ink-3:#6F7565;
    --accent:#F0603F; --accent-ink:#16100D;
    --good:#8FBF7F; --good-dim:rgba(143,191,127,.14); --warn:#E0B34E; --bad:#E06A5A;
  }
  :root[data-theme="light"]{
    --bg:#E6E3D8; --shell:#EFECE1; --card:#FFFFFF; --card-2:#F3F0E6;
    --line:#D8D4C4; --ink:#1B2117; --ink-2:#5C6152; --ink-3:#8B9080;
    --accent:#C24A2A; --accent-ink:#FFF6EF;
    --good:#3E7A38; --good-dim:rgba(62,122,56,.10); --warn:#8F6B14; --bad:#B2402F;
  }

  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--body); -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center; align-items:stretch;
  }
  button{font:inherit; color:inherit; background:none; border:none; cursor:pointer; text-align:left}
  button:focus-visible, input:focus-visible, a:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
  input{font:inherit; color:inherit}

  /* ---------- shell ---------- */
  .shell{
    position:relative; width:min(430px,100vw); min-height:100dvh;
    background:var(--shell); display:flex; flex-direction:column; overflow:hidden;
  }
  @media (min-width:520px){
    body{align-items:center; padding:28px 0}
    .shell{
      min-height:0; height:min(880px, calc(100dvh - 56px));
      border-radius:26px; border:1px solid var(--line);
      box-shadow:0 40px 90px -30px rgba(0,0,0,.55);
    }
  }
  .view{flex:1; overflow-y:auto; overscroll-behavior:contain; padding-bottom:96px; scrollbar-width:thin}
  .view.no-tabs{padding-bottom:0}

  @media (prefers-reduced-motion: no-preference){
    .screen-in{animation:rise .32s cubic-bezier(.2,.7,.2,1)}
    @keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
    .tl-step.live .knot{animation:pulse 1.5s ease-in-out infinite}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,96,63,.5)} 50%{box-shadow:0 0 0 9px rgba(240,96,63,0)}}
  }

  /* ---------- type ---------- */
  .eyebrow{font-family:var(--mono); font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-3)}
  .display{font-family:var(--display); font-weight:400; letter-spacing:.005em; text-wrap:balance}
  .serif-i{font-family:var(--display); font-style:italic}
  .mono{font-family:var(--mono)}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- header ---------- */
  .hdr{
    position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--shell) 88%, transparent);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px 12px; border-bottom:1px solid var(--line);
  }
  .wordmark{font-family:var(--display); font-size:21px; letter-spacing:.02em}
  .wordmark em{font-style:italic}
  .hdr .sub{font-family:var(--mono); font-size:9.5px; letter-spacing:.22em; color:var(--ink-3); margin-top:2px; text-transform:uppercase}
  .side-btn{
    font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-2); border:1px solid var(--line); border-radius:999px; padding:7px 12px;
  }
  .side-btn:hover{color:var(--ink); border-color:var(--ink-3)}

  /* ---------- tab bar ---------- */
  .tabs{
    position:absolute; bottom:0; left:0; right:0; z-index:30;
    display:flex; border-top:1px solid var(--line);
    background:color-mix(in srgb, var(--shell) 92%, transparent);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tab{
    flex:1; padding:13px 4px 15px; text-align:center;
    font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-3); position:relative;
  }
  .tab .glyph{display:block; font-family:var(--display); font-size:17px; font-style:italic; margin-bottom:4px; letter-spacing:0}
  .tab.on{color:var(--ink)}
  .tab.on::before{content:""; position:absolute; top:-1px; left:24%; right:24%; height:2px; background:var(--accent)}
  .tab .dot{position:absolute; top:8px; right:22%; width:7px; height:7px; border-radius:50%; background:var(--accent)}

  /* ---------- shared blocks ---------- */
  .pad{padding:20px}
  .stack{display:flex; flex-direction:column; gap:14px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px}
  .rule{height:1px; background:var(--line); border:none}
  .sect{display:flex; align-items:baseline; justify-content:space-between; margin:10px 2px 2px}
  .btn{
    display:block; width:100%; text-align:center; border-radius:14px; padding:15px 18px;
    font-weight:600; font-size:15px; letter-spacing:.01em;
  }
  .btn-hot{background:var(--accent); color:var(--accent-ink)}
  .btn-hot:hover{filter:brightness(1.06)}
  .btn-ghost{border:1px solid var(--line); color:var(--ink)}
  .btn-ghost:hover{border-color:var(--ink-3)}
  .btn-danger{border:1px solid color-mix(in srgb, var(--bad) 55%, transparent); color:var(--bad)}
  .btn[disabled]{opacity:.45; cursor:default}
  .chiprow{display:flex; gap:8px; overflow-x:auto; padding:2px; scrollbar-width:none}
  .chip{
    flex:none; font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    padding:9px 14px; border-radius:999px; border:1px solid var(--line); color:var(--ink-2); white-space:nowrap;
  }
  .chip.on{background:var(--ink); color:var(--shell); border-color:var(--ink)}
  .tag{
    display:inline-block; font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
    border:1px solid var(--line); border-radius:4px; padding:3px 7px; color:var(--ink-2);
  }
  .tag-good{border-color:transparent; background:var(--good-dim); color:var(--good)}
  .tag-hot{border-color:transparent; background:rgba(240,96,63,.14); color:var(--accent)}
  .tag-warn{border-color:transparent; background:rgba(224,179,78,.14); color:var(--warn)}

  .banner{border-radius:12px; padding:11px 14px; font-size:12.5px; line-height:1.5}
  .banner-warn{background:rgba(224,179,78,.1); border:1px solid color-mix(in srgb, var(--warn) 35%, transparent); color:var(--ink-2)}
  .banner-warn b{color:var(--warn)}
  .banner-bad{background:rgba(224,106,90,.08); border:1px solid color-mix(in srgb, var(--bad) 40%, transparent); color:var(--ink-2)}
  .banner-bad b{color:var(--bad)}

  /* included strip */
  .included{background:var(--good-dim); border:1px solid color-mix(in srgb, var(--good) 30%, transparent); border-radius:16px; padding:15px 16px}
  .included h3{font-family:var(--display); font-style:italic; font-weight:400; font-size:18px; margin-bottom:9px}
  .inc-row{display:flex; gap:10px; align-items:baseline; padding:4.5px 0; font-size:13.5px; color:var(--ink-2)}
  .inc-row b{color:var(--ink); font-weight:600}
  .inc-row .ck{color:var(--good); font-family:var(--mono); font-size:12px}

  /* ---------- paint chips / fleet ---------- */
  .fleet-card{display:flex; gap:14px; align-items:stretch; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; width:100%}
  .fleet-card:hover{border-color:var(--ink-3)}
  .swatch{flex:none; width:64px; border-radius:10px; position:relative; min-height:76px}
  .swatch::after{content:""; position:absolute; inset:0; border-radius:10px; box-shadow:inset 0 1px 0 rgba(255,255,255,.25), inset 0 -8px 18px rgba(0,0,0,.25)}
  .fc-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px}
  .fc-name{font-family:var(--display); font-size:17.5px; line-height:1.2}
  .fc-meta{font-family:var(--mono); font-size:10px; letter-spacing:.06em; color:var(--ink-3); text-transform:uppercase}
  .fc-note{font-size:12px; color:var(--ink-2); margin-top:2px}
  .fc-price{flex:none; text-align:right; display:flex; flex-direction:column; justify-content:space-between; align-items:flex-end}
  .fc-price .n{font-family:var(--display); font-size:19px}
  .fc-price .per{font-family:var(--mono); font-size:9px; letter-spacing:.12em; color:var(--ink-3); text-transform:uppercase}
  .fc-price .go{font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--accent); text-transform:uppercase}

  .hero-swatch{height:190px; border-radius:18px; position:relative; overflow:hidden}
  .hero-swatch::after{content:""; position:absolute; inset:0; box-shadow:inset 0 2px 0 rgba(255,255,255,.3), inset 0 -30px 60px rgba(0,0,0,.3); border-radius:18px}
  .hero-swatch .lot{
    position:absolute; top:12px; left:12px; font-family:var(--mono); font-size:10px; letter-spacing:.14em;
    background:rgba(0,0,0,.42); color:#F2EDE0; padding:5px 9px; border-radius:5px;
  }
  .hero-swatch .paint{
    position:absolute; bottom:12px; left:12px; font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
    background:rgba(0,0,0,.42); color:#F2EDE0; padding:5px 9px; border-radius:5px;
  }
  .spec-row{display:grid; grid-template-columns:repeat(4,1fr); border:1px solid var(--line); border-radius:14px; overflow:hidden}
  .spec{padding:12px 6px; text-align:center; border-left:1px solid var(--line)}
  .spec:first-child{border-left:none}
  .spec .v{font-family:var(--display); font-size:17px}
  .spec .k{font-family:var(--mono); font-size:8.5px; letter-spacing:.14em; color:var(--ink-3); text-transform:uppercase; margin-top:3px}

  .concierge{border-left:2px solid var(--accent); padding:4px 0 4px 14px; margin:4px 2px}
  .concierge p{font-family:var(--display); font-style:italic; font-size:15.5px; line-height:1.45; color:var(--ink)}
  .concierge .who{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); margin-top:7px}

  /* form bits */
  .frow{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 0; border-bottom:1px solid var(--line)}
  .frow:last-child{border-bottom:none}
  .frow label{font-size:13.5px; color:var(--ink-2)}
  .frow input[type=date]{
    background:var(--card-2); border:1px solid var(--line); border-radius:9px; padding:8px 10px;
    font-family:var(--mono); font-size:12.5px; color-scheme:dark;
  }
  :root[data-theme="light"] .frow input[type=date]{color-scheme:light}
  @media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .frow input[type=date]{color-scheme:light} }
  .step{display:flex; align-items:center; gap:0; border:1px solid var(--line); border-radius:10px; overflow:hidden}
  .step button{padding:8px 14px; font-family:var(--mono); font-size:14px; color:var(--ink-2)}
  .step button:hover{color:var(--ink)}
  .step .val{padding:8px 12px; font-family:var(--mono); font-size:12.5px; border-left:1px solid var(--line); border-right:1px solid var(--line); min-width:70px; text-align:center}
  .seg{display:flex; flex-direction:column; gap:8px}
  .seg-opt{display:flex; justify-content:space-between; align-items:center; gap:10px; border:1px solid var(--line); border-radius:12px; padding:12px 14px; width:100%}
  .seg-opt.on{border-color:var(--accent); background:rgba(240,96,63,.07)}
  .seg-opt .t{font-size:13.5px; font-weight:600}
  .seg-opt .d{font-size:11.5px; color:var(--ink-3); margin-top:2px}
  .seg-opt .p{font-family:var(--mono); font-size:11.5px; color:var(--ink-2)}

  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:13px}
  .field label{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
  .field input{
    background:var(--card-2); border:1px solid var(--line); border-radius:11px; padding:12px 13px;
    font-size:14.5px; width:100%;
  }
  .field input::placeholder{color:var(--ink-3)}
  .field .hint{font-size:11px; color:var(--ink-3)}
  .ferr{font-size:12.5px; color:var(--bad); line-height:1.45}

  .line-item{display:flex; justify-content:space-between; gap:10px; padding:7px 0; font-size:13.5px; color:var(--ink-2)}
  .line-item .r{font-family:var(--mono); font-size:12.5px; color:var(--ink)}
  .line-item.total{border-top:1px solid var(--line); margin-top:6px; padding-top:12px; color:var(--ink); font-weight:600}
  .line-item .good{color:var(--good)}

  /* signature services */
  .svc{display:flex; gap:12px; align-items:flex-start; width:100%; padding:12px 2px; border-bottom:1px solid var(--line); text-align:left}
  .svc:last-child{border-bottom:none}
  .svc .box{flex:none; width:20px; height:20px; margin-top:1px; border-radius:6px; border:1.5px solid var(--ink-3); display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--accent-ink)}
  .svc.on .box{background:var(--accent); border-color:var(--accent)}
  .svc .st{font-size:13.5px; font-weight:600}
  .svc .sd{font-size:11.5px; color:var(--ink-2); margin-top:3px; line-height:1.45}
  .svc .sf{font-size:11px; color:var(--warn); margin-top:3px; line-height:1.4}

  /* privacy radio */
  .radio-opt{display:flex; gap:12px; width:100%; border:1px solid var(--line); border-radius:14px; padding:13px 14px; text-align:left; align-items:flex-start}
  .radio-opt.on{border-color:var(--good); background:var(--good-dim)}
  .radio-opt .rb{flex:none; width:18px; height:18px; margin-top:1px; border-radius:50%; border:1.5px solid var(--ink-3); position:relative}
  .radio-opt.on .rb{border-color:var(--good)}
  .radio-opt.on .rb::after{content:""; position:absolute; inset:3.5px; border-radius:50%; background:var(--good)}
  .radio-opt .rt{font-size:13.5px; font-weight:600}
  .radio-opt .rd{font-size:12px; color:var(--ink-2); margin-top:4px; line-height:1.5}

  /* tracker */
  .tl{position:relative; padding-left:26px}
  .tl::before{content:""; position:absolute; left:8px; top:10px; bottom:14px; width:1px; background:var(--line)}
  .tl-step{position:relative; padding:0 0 22px}
  .tl-step:last-child{padding-bottom:2px}
  .tl-step .knot{position:absolute; left:-26px; top:3px; width:17px; height:17px; border-radius:50%; border:1.5px solid var(--line); background:var(--shell); display:flex; align-items:center; justify-content:center; font-size:9px; color:var(--good)}
  .tl-step.done .knot{border-color:var(--good); background:var(--good-dim)}
  .tl-step.live .knot{border-color:var(--accent); background:var(--accent)}
  .tl-step h4{font-size:14.5px; font-weight:600}
  .tl-step .when{font-family:var(--mono); font-size:10px; color:var(--ink-3); letter-spacing:.08em; margin-top:2px}
  .tl-step .desc{font-size:12.5px; color:var(--ink-2); margin-top:4px; line-height:1.45}
  .tl-step.dim h4{color:var(--ink-3)}

  .msg{background:var(--card-2); border:1px solid var(--line); border-radius:14px 14px 14px 4px; padding:12px 14px; max-width:92%}
  .msg p{font-size:13.5px; line-height:1.5}
  .msg .who{font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); margin-bottom:5px}

  /* partner */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px}
  .stat .v{font-family:var(--display); font-size:24px}
  .stat .k{font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); margin-top:4px}
  .stat .s{font-size:11px; color:var(--ink-2); margin-top:5px; line-height:1.4}
  .tier-bar{height:6px; border-radius:99px; background:var(--card-2); overflow:hidden; margin-top:10px}
  .tier-bar i{display:block; height:100%; background:var(--accent); border-radius:99px}
  .tier-row{display:flex; gap:10px; align-items:baseline; padding:11px 0; border-bottom:1px solid var(--line); font-size:13px}
  .tier-row:last-child{border-bottom:none}
  .tier-row .nm{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; width:64px; flex:none}
  .tier-row .cut{font-family:var(--mono); font-size:12px; flex:none; width:44px; color:var(--ink)}
  .tier-row .pk{color:var(--ink-2); font-size:12px; line-height:1.45}
  .tier-row.you .nm{color:var(--accent)}

  .req-card{border:1px solid var(--line); border-radius:16px; background:var(--card); overflow:hidden}
  .req-head{display:flex; gap:12px; padding:14px 16px; align-items:center}
  .avatar{flex:none; width:38px; height:38px; border-radius:50%; background:var(--card-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:var(--display); font-style:italic; font-size:15px}
  .req-body{padding:0 16px 14px; display:flex; flex-direction:column; gap:8px}
  .req-actions{display:flex; border-top:1px solid var(--line)}
  .req-actions button{flex:1; padding:13px; text-align:center; font-weight:600; font-size:13.5px}
  .req-actions .ok{color:var(--good)}
  .req-actions .no{color:var(--ink-3); border-left:1px solid var(--line)}
  .kv{display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-2); gap:10px}
  .kv .r{font-family:var(--mono); font-size:11.5px; color:var(--ink); text-align:right}

  .toggle{flex:none; width:44px; height:26px; border-radius:99px; background:var(--card-2); border:1px solid var(--line); position:relative}
  .toggle i{position:absolute; top:2.5px; left:3px; width:19px; height:19px; border-radius:50%; background:var(--ink-3); transition:transform .18s, background .18s}
  .toggle.on{background:var(--good-dim); border-color:var(--good)}
  .toggle.on i{transform:translateX(18px); background:var(--good)}
  @media (prefers-reduced-motion: reduce){ .toggle i{transition:none} }

  /* gate */
  .gate{min-height:100%; display:flex; flex-direction:column; justify-content:flex-end; padding:28px 24px 34px; position:relative}
  .gate-art{position:absolute; inset:0; overflow:hidden; pointer-events:none}
  .gate-strip{position:absolute; border-radius:99px; opacity:.85}
  .gate-inner{position:relative; display:flex; flex-direction:column; gap:0}
  .gate .wm{font-family:var(--display); font-size:46px; line-height:1.02; letter-spacing:.005em; margin:12px 0 4px}
  .gate .wm em{font-style:italic}
  .gate .lede{font-size:14.5px; line-height:1.55; color:var(--ink-2); max-width:36ch; margin:8px 0 18px}
  .gate .lede b{color:var(--ink); font-weight:600}
  .gate .foot{font-size:11.5px; color:var(--ink-3); line-height:1.55; margin-top:16px; max-width:40ch}

  .toast{
    position:absolute; left:50%; bottom:92px; transform:translateX(-50%);
    background:var(--ink); color:var(--shell); font-size:12.5px; font-weight:600;
    padding:10px 16px; border-radius:99px; z-index:50; white-space:nowrap; max-width:92%;
    overflow:hidden; text-overflow:ellipsis;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  @media (prefers-reduced-motion: no-preference){
    .toast{animation:toastin .25s cubic-bezier(.2,.7,.2,1)}
    @keyframes toastin{from{opacity:0; transform:translate(-50%,8px)} to{opacity:1; transform:translate(-50%,0)}}
  }

  .modal-back{position:absolute; inset:0; z-index:60; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center}

/* ---------------- api ---------------- */

async function api(pathName, opts = {}){
  const token = pathName.startsWith("/provider") ? S.provCsrf : S.csrf;
  const res = await fetch("/api" + pathName, {
    method: opts.method || "GET",
    headers: { "content-type": "application/json", ...(token ? { "x-tn-csrf": token } : {}) },
    credentials: "same-origin",
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch { /* empty */ }
  if (!res.ok) { const e = new Error(data.error || ("Request failed (" + res.status + ")")); e.status = res.status; throw e; }
  return data;
}

async function detectBackend(){
  try {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 2500);
    const res = await fetch("/api/health", { signal: ctl.signal });
    clearTimeout(t);
    S.backend = res.ok;
  } catch { S.backend = false; }
  if (S.backend) {
    try {
      const me = await api("/customer/me");
      if (me.customer) { S.auth = me.customer; S.csrf = me.csrf; }
      else if (me.guest) { S.csrf = me.csrf; }
    } catch { /* not signed in */ }
  }
  render();
}

/* ---------------- renter: tracker (live server data only) ---------------- */

function trackerHTML(){
  const r = S.myReq;
  if(!r) return `<div class="pad screen-in"><p style="color:var(--ink-2)">No live request.</p></div>`;
  const c = car(r.carId);
  const done = { sent:0, waiting:1, decided:2 };
  const stage = r.status === "pending_provider" ? 1 : 2;
  const declined = r.status === "declined";
  const booked = r.status === "booked";
  const approved = r.status === "approved";
  const steps = [
    {t:"Request sent", d:"Dates, delivery and the estimate locked in writing. Card not charged.", when:ftime(r.createdAt)},
    {t:"Waiting on provider confirmation", d:"TopNotch is a brokerage — the provider must confirm the exact vehicle and dates before an approved quote or any payment. No countdown, no invented estimate: the real answer lands here.", when:""},
    declined
      ? {t:"Provider can't make it work", d:"It happens. You were never charged. Ask the concierge for a close match.", when:""}
      : {t: booked ? "Booked" : "Approved — your quote is confirmed", d: booked ? "Payment recorded. Deposit is refundable after the documented vehicle-return review and rental-agreement requirements." : "The provider confirmed the exact vehicle and dates. Review the quote below — payment only happens if you approve it.", when:""},
  ];
  return `
  <div class="pad stack screen-in">
    <button class="side-btn" style="align-self:flex-start" data-act="goTrips">← Trips</button>
    <div>
      <div class="eyebrow" style="margin-bottom:6px">Live request · ${esc(r.id)}</div>
      <h2 class="display" style="font-size:24px">${c?c.name:esc(r.carName||"")}</h2>
      <div class="mono" style="font-size:11px; color:var(--ink-2); margin-top:6px">
        ${fdateStr(r.start)} – ${fdateEnd(r.start, r.days)} · ${deliveryLabel(r.delivery)}
      </div>
      ${r.services && r.services.length?`<div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px">
        ${r.services.map(s=>`<span class="tag tag-warn">${esc(svc(s.id)?svc(s.id).name:s.id)} — confirmed separately</span>`).join("")}
      </div>`:""}
    </div>
    <div class="card">
      <div class="tl">
        ${steps.map((s,i)=>{
          const isDone = i < stage || (i === stage && (declined || approved || booked));
          const isLive = i === stage && !declined && !approved && !booked;
          return `
          <div class="tl-step ${isDone?"done":""} ${isLive?"live":""} ${i>stage?"dim":""}">
            <span class="knot">${isDone?"✓":""}</span>
            <h4>${s.t}</h4>
            ${s.when?`<div class="when">${s.when}</div>`:""}
            <div class="desc">${s.d}</div>
          </div>`;
        }).join("")}
      </div>
    </div>
    ${approved && r.quote?`
    <div class="card" style="border-color:color-mix(in srgb, var(--good) 45%, transparent)">
      <div class="eyebrow" style="color:var(--good); margin-bottom:8px">Approved quote</div>
      <div class="line-item"><span>Rental (${r.days} day${r.days>1?"s":""})</span><span class="r num">${fmt(r.quote.rental)}</span></div>
      <div class="line-item"><span>Delivery</span><span class="r num">${r.quote.deliveryFee===0?"Free":fmt(r.quote.deliveryFee)}</span></div>
      <div class="line-item"><span>Insurance (eligibility verified)</span><span class="r good">Included</span></div>
      <div class="line-item"><span>Deposit — refundable after return review</span><span class="r num">${fmt(r.quote.deposit)}</span></div>
      <div class="line-item total"><span>Total if you approve</span><span class="r num">${fmt(r.quote.total)}</span></div>
      <button class="btn btn-hot" style="margin-top:12px" data-act="payRequest" data-id="${esc(r.id)}" ${S.busy?"disabled":""}>Approve quote &amp; pay ${fmt(r.quote.total)}</button>
      <p style="font-size:10.5px; color:var(--ink-3); margin-top:8px; text-align:center">Demo payment — no live processor is connected.</p>
    </div>`:""}
    <div class="stack" style="gap:10px">
      ${(r.events||[]).map(m=>`
        <div class="msg"><div class="who">${m.by==="provider"?"Provider — via TopNotch":"TopNotch"} · ${ftime(m.at)}${m.ai?" · <span style='color:var(--accent)'>AI-assisted</span>":""}</div><p>${esc(m.text)}</p></div>`).join("")}
    </div>
    ${booked?`<button class="btn btn-ghost" data-act="goTrips">View it in Trips →</button>`:""}
    ${declined?`<button class="btn btn-ghost" data-act="backFleet">Back to the fleet</button>`:""}
    <p style="font-size:11.5px; color:var(--ink-3); line-height:1.6; padding:0 4px">
      Why not instant book? Because we'd be guessing. This tracker shows the provider's real
      answer, whenever it arrives — not a timer we made up.
      ${r.status==="pending_provider" ? "This request is sitting in the provider portal right now — the fleet-partner side of this app is where it gets answered." : ""}
    </p>
  </div>`;
}

function render(){
  const shell = document.getElementById("shell");
  let html = "";

  if(S.mode==="gate"){
    html = gateHTML();
  } else if(S.mode==="renter"){
    let body;
    if(S.screen && S.screen.kind==="car") body = carHTML(S.screen.id);
    else if(S.screen && S.screen.kind==="tracker") body = trackerHTML();
    else if(S.screen && S.screen.kind==="previewfail") body = previewFailHTML();
    else body = {fleet:fleetHTML, trips:tripsHTML, list:listHTML, account:accountHTML}[S.rTab]();
    const liveReq = S.history.some(r=>r.status==="pending_provider"||r.status==="approved");
    html =
      headerHTML(S.auth?`Rentals · ${esc(S.auth.name.split(" ")[0])}`:"Rentals · Guest", "Partner side ⇄", "toPartner") +
      `<div class="view" id="view">${body}</div>` +
      tabsHTML(R_TABS, S.screen?null:S.rTab, "rTab", liveReq?"trips":null);
  } else {
    const body = {today:pTodayHTML, reqs:pReqsHTML, garage:pGarageHTML, earn:pEarnHTML}[S.pTab]();
    const pending = S.provider && S.provReqs.some(r=>r.status==="pending_provider");
    html =
      headerHTML("Fleet partner portal", "Renter side ⇄", "toRenter") +
      `<div class="view" id="view">${body}</div>` +
      tabsHTML(P_TABS, S.pTab, "pTab", pending?"reqs":null);
  }

  if(S.delModal) html += deleteModalHTML();
  if(S.toastMsg) html += `<div class="toast" role="status">${esc(S.toastMsg)}</div>`;
  shell.innerHTML = html;
}

/* ---------------- data loaders ---------------- */

async function loadHistory(){
  if(!S.backend) return;
  try {
    const out = await api("/customer/trips");
    S.history = out.requests || [];
  } catch { S.history = []; }
}
async function loadProviderInbox(){
  if(!S.backend || !S.provider) return;
  try {
    const out = await api("/provider/requests");
    S.provReqs = out.requests || [];
  } catch(e){ if(e.status===403){ S.provider=null; } S.provReqs = []; }
}
function startTrackerPoll(){
  stopPoll();
  S.pollTimer = setInterval(async () => {
    if(!S.myReq || !(S.screen && S.screen.kind==="tracker")) { stopPoll(); return; }
    try {
      const out = await api("/customer/requests/" + encodeURIComponent(S.myReq.id));
      const prev = S.myReq.status;
      S.myReq = out.request;
      if(out.request.status !== prev){ await loadHistory(); render(); }
    } catch { /* keep last known */ }
  }, 3500);
}

/* ---------------- form value grabs ---------------- */

const val = (id) => { const el = document.getElementById(id); return el ? el.value : ""; };

/* ---------------- events ---------------- */

document.addEventListener("click", async (e) => {
  const stopEl = e.target.closest("[data-stop]");
  const el = e.target.closest("[data-act]");
  if(!el) return;
  if(stopEl && el.dataset.act==="closeDelete" && stopEl.contains(el)===false) return;
  const act = el.dataset.act, id = el.dataset.id;
  const scrollTop = () => { const v=document.getElementById("view"); if(v) v.scrollTop=0; };

  /* No render between setting busy and running fn — fn reads form fields
   * from the live DOM, and a re-render would wipe what the user typed. */
  const guard = async (fn) => {
    if(S.busy) return;
    S.busy = true; S.err = null;
    try { await fn(); }
    catch(err){ S.err = err.message; }
    S.busy = false; render();
  };

  switch(act){
    /* ---- gate & auth ---- */
    case "gateView": S.gateView = id; S.err = null; S.notice = null; render(); break;
    case "gateSignup": S.mode="gate"; S.gateView="signup"; S.err=null; render(); break;
    case "gateSignin": S.mode="gate"; S.gateView="signin"; S.err=null; render(); break;
    case "enterGuest": S.mode="renter"; S.rTab="fleet"; S.screen=null; loadHistory().then(render); render(); break;
    case "enterPartner": S.mode="partner"; S.pTab="today"; loadProviderInbox().then(render); render(); break;
    case "toPartner": S.mode="partner"; stopPoll(); loadProviderInbox().then(render); render(); break;
    case "toRenter": S.mode="renter"; loadHistory().then(render); render(); break;

    case "doRegister": await guard(async () => {
      if(S.backend===false){ S.gateView="menu"; toast("Preview mode: no TopNotch server is connected, so accounts can't be created. Nothing was saved."); return; }
      const pw = val("f-pass");
      if(pw.length < 10) throw new Error("Password must be at least 10 characters.");
      const out = await api("/customer/register", { method:"POST", body:{ name:val("f-name"), mobile:val("f-mobile"), email:val("f-email"), password:pw } });
      S.auth = out.customer; S.csrf = out.csrf;
      S.mode = "renter"; S.rTab = "account"; S.screen = null;
      await loadHistory();
      toast("Account created — a verification code was emailed to you");
    }); break;

    case "doLogin": await guard(async () => {
      if(S.backend===false){ S.gateView="menu"; toast("Preview mode: no TopNotch server is connected, so sign-in isn't available. Nothing was saved."); return; }
      const out = await api("/customer/login", { method:"POST", body:{ email:val("f-email"), password:val("f-pass") } });
      S.auth = out.customer; S.csrf = out.csrf;
      S.mode = "renter"; S.rTab = "fleet"; S.screen = null;
      await loadHistory();
      toast("Welcome back, " + out.customer.name.split(" ")[0]);
    }); break;

    case "doForgot": await guard(async () => {
      if(S.backend===false){ toast("Preview mode: no server connected — reset emails can't be sent."); return; }
      const out = await api("/customer/password-reset/request", { method:"POST", body:{ email:val("f-email") } });
      S.notice = out.notice; S.gateView = "reset";
    }); break;

    case "doReset": await guard(async () => {
      if(S.backend===false){ toast("Preview mode: no server connected."); return; }
      const out = await api("/customer/password-reset/confirm", { method:"POST", body:{ token:val("f-token"), newPassword:val("f-pass") } });
      S.notice = out.notice; S.gateView = "signin"; S.auth = null; S.csrf = null;
    }); break;

    /* ---- account ---- */
    case "saveProfile": await guard(async () => {
      const out = await api("/customer/me", { method:"PATCH", body:{ name:val("p-name"), mobile:val("p-mobile") } });
      S.auth = out.customer; toast("Profile saved");
    }); break;

    case "setAcctAI": await guard(async () => {
      const out = await api("/customer/me", { method:"PATCH", body:{ aiPref:id } });
      S.auth = out.customer;
      toast(id==="human" ? "AI permission withdrawn — Human-only service" : "AI-assisted service allowed — you can withdraw this anytime");
    }); break;

    case "doVerify": await guard(async () => {
      await api("/customer/verify-email/confirm", { method:"POST", body:{ token:val("v-token") } });
      const me = await api("/customer/me"); S.auth = me.customer;
      toast("Email verified");
    }); break;

    case "doResendVerify": await guard(async () => {
      const out = await api("/customer/verify-email/request", { method:"POST" });
      S.notice = "A fresh code is on its way to " + (out.sentTo || "your email") + ".";
    }); break;

    case "doForgotFromAcct": await guard(async () => {
      const out = await api("/customer/password-reset/request", { method:"POST", body:{ email:S.auth.email } });
      toast(out.notice || "Reset code emailed");
    }); break;

    case "doLogout": await guard(async () => {
      await api("/customer/logout", { method:"POST" });
      S.auth = null; S.csrf = null; S.history = []; S.myReq = null;
      S.mode = "gate"; S.gateView = "menu";
      toast("Signed out");
    }); break;

    case "doLogoutAll": await guard(async () => {
      const out = await api("/customer/logout-all", { method:"POST" });
      S.auth = null; S.csrf = null; S.history = []; S.myReq = null;
      S.mode = "gate"; S.gateView = "menu";
      toast(`Signed out of ${out.revokedSessions} session${out.revokedSessions===1?"":"s"} everywhere`);
    }); break;

    case "openDelete": S.delModal = true; S.delErr = null; render(); break;
    case "closeDelete": S.delModal = false; render(); break;
    case "doDelete":
      if(S.busy) break;
      S.busy = true; S.delErr = null;
      try {
        const out = await api("/customer/me", { method:"DELETE", body:{ password:val("d-pass") } });
        S.auth = null; S.csrf = null; S.history = []; S.myReq = null; S.delModal = false;
        S.mode = "gate"; S.gateView = "menu";
        S.busy = false;
        toast("Account deleted. " + (out.notice ? "Records required by law are retained per the Privacy Policy." : ""));
      } catch(err){ S.delErr = err.message; S.busy = false; render(); }
      break;

    /* ---- renter nav ---- */
    case "rTab": S.rTab=id; S.screen=null; S.err=null; stopPoll();
      if(id==="trips"||id==="account") await loadHistory();
      render(); scrollTop(); break;
    case "pTab": S.pTab=id; S.err=null;
      if(id==="reqs") await loadProviderInbox();
      render(); scrollTop(); break;
    case "setCity": S.city=id; render(); break;
    case "openCar":
      S.mode="renter"; S.screen={kind:"car", id}; S.err=null; stopPoll();
      S.form={start:tomorrowISO(), days:2, delivery:"pickup", services:new Set(), aiChoice:"human", contact:{...S.form.contact}};
      render(); scrollTop(); break;
    case "backFleet": S.screen=null; S.rTab="fleet"; S.err=null; stopPoll(); render(); scrollTop(); break;
    case "goTrips": S.screen=null; S.rTab="trips"; stopPoll(); await loadHistory(); render(); scrollTop(); break;
    case "openTracker": {
      stopPoll();
      const found = S.history.find(r=>r.id===id) || S.myReq;
      if(found){ S.myReq = found; S.screen={kind:"tracker"};
        if(S.backend){ try{ const out = await api("/customer/requests/"+encodeURIComponent(found.id)); S.myReq = out.request; }catch{} startTrackerPoll(); }
      }
      render(); scrollTop(); break;
    }
    case "daysDec": S.form.days=Math.max(1,S.form.days-1); render(); break;
    case "daysInc": S.form.days=Math.min(30,S.form.days+1); render(); break;
    case "setDelivery": S.form.delivery=id; render(); break;
    case "toggleSvc":
      if(S.form.services.has(id)) S.form.services.delete(id); else S.form.services.add(id);
      render(); break;
    case "setAI": S.form.aiChoice=id; render(); break;

    /* ---- request submission — honest in both modes ---- */
    case "submitRequest": await guard(async () => {
      if(!S.auth){
        S.form.contact = { name:val("g-name"), mobile:val("g-mobile"), email:val("g-email") };
      }
      if(S.backend===false || S.backend===null){
        // Never silently turn a failed live request into a fake success.
        S.screen = {kind:"previewfail", id};
        return;
      }
      const body = {
        carId:id, start:S.form.start, days:S.form.days, delivery:S.form.delivery,
        services:[...S.form.services], aiChoice:S.form.aiChoice,
        ...(S.auth ? {} : { contact:S.form.contact }),
      };
      try {
        const out = await api("/customer/requests", { method:"POST", body });
        S.myReq = out.request; S.csrf = out.csrf || S.csrf;
        S.screen = {kind:"tracker"};
        await loadHistory();
        startTrackerPoll();
      } catch(err){
        if(err.status===undefined){ S.backend=false; S.screen={kind:"previewfail", id}; return; }
        throw err;
      }
    }); scrollTop(); break;

    case "payRequest": await guard(async () => {
      const out = await api("/customer/requests/"+encodeURIComponent(id)+"/pay", { method:"POST", body:{ method:"demo" } });
      S.myReq = out.request;
      await loadHistory();
      toast("Payment recorded — you're booked");
    }); break;

    /* ---- provider portal ---- */
    case "provLogin": await guard(async () => {
      const out = await api("/provider/login", { method:"POST", body:{ email:val("pv-email"), password:val("pv-pass") } });
      S.provider = out.provider; S.provCsrf = out.csrf;
      await loadProviderInbox();
    }); break;

    case "provDecide": await guard(async () => {
      await api("/provider/requests/"+encodeURIComponent(id)+"/decision", { method:"POST", body:{ decision: el.dataset.d } });
      await loadProviderInbox();
      toast(el.dataset.d==="approve" ? "Confirmed — the renter can now approve the quote" : "Declined — the renter was never charged");
    }); break;

    /* ---- misc ---- */
    case "toggleListing": {
      const l=S.sample.listings.find(x=>x.carId===id);
      if(l){ l.live=!l.live; toast(l.live?"Taking requests again (sample)":"Paused (sample) — no tier penalty"); }
      break;
    }
    case "copyCode":
      (navigator.clipboard ? navigator.clipboard.writeText("TN-ALX-305") : Promise.reject())
        .then(()=>toast("Code copied — worth $75 to a friend"))
        .catch(()=>toast("Your code: TN-ALX-305"));
      break;
    case "scoutToast": toast("We'll text you an intro link — check your messages"); break;
    case "igToast": toast("Opens @305.pluggedin on Instagram"); break;
    case "addCarToast": toast("Spec sheet form sent to your email"); break;
  }
});

document.addEventListener("change", (e) => {
  if(e.target.id==="startdate" && e.target.value){
    S.form.start = e.target.value;
  }
});

render();
detectBackend();
</script>
