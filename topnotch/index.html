<title>TopNotch — South Florida</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{
    --bg:#0F130E;
    --shell:#121711;
    --card:#1A211A;
    --card-2:#212A21;
    --line:#2C362B;
    --ink:#EDE6D6;
    --ink-2:#A8AE9B;
    --ink-3:#6F7565;
    --accent:#F0603F;
    --accent-ink:#16100D;
    --good:#8FBF7F;
    --good-dim:rgba(143,191,127,.14);
    --warn:#E0B34E;
    --display:'Didot','Bodoni MT','Bodoni 72','Playfair Display','Georgia Pro',Georgia,serif;
    --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    --mono:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#E6E3D8; --shell:#EFECE1; --card:#FFFFFF; --card-2:#F3F0E6;
      --line:#D8D4C4; --ink:#1B2117; --ink-2:#5C6152; --ink-3:#8B9080;
      --accent:#C24A2A; --accent-ink:#FFF6EF;
      --good:#3E7A38; --good-dim:rgba(62,122,56,.10); --warn:#8F6B14;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F130E; --shell:#121711; --card:#1A211A; --card-2:#212A21;
    --line:#2C362B; --ink:#EDE6D6; --ink-2:#A8AE9B; --ink-3:#6F7565;
    --accent:#F0603F; --accent-ink:#16100D;
    --good:#8FBF7F; --good-dim:rgba(143,191,127,.14); --warn:#E0B34E;
  }
  :root[data-theme="light"]{
    --bg:#E6E3D8; --shell:#EFECE1; --card:#FFFFFF; --card-2:#F3F0E6;
    --line:#D8D4C4; --ink:#1B2117; --ink-2:#5C6152; --ink-3:#8B9080;
    --accent:#C24A2A; --accent-ink:#FFF6EF;
    --good:#3E7A38; --good-dim:rgba(62,122,56,.10); --warn:#8F6B14;
  }

  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--body); -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center; align-items:stretch;
  }
  button{font:inherit; color:inherit; background:none; border:none; cursor:pointer; text-align:left}
  button:focus-visible, input:focus-visible, a:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
  input{font:inherit; color:inherit}

  /* ---------- shell ---------- */
  .shell{
    position:relative; width:min(430px,100vw); min-height:100dvh;
    background:var(--shell); display:flex; flex-direction:column; overflow:hidden;
  }
  @media (min-width:520px){
    body{align-items:center; padding:28px 0}
    .shell{
      min-height:0; height:min(880px, calc(100dvh - 56px));
      border-radius:26px; border:1px solid var(--line);
      box-shadow:0 40px 90px -30px rgba(0,0,0,.55);
    }
  }
  .view{flex:1; overflow-y:auto; overscroll-behavior:contain; padding-bottom:96px; scrollbar-width:thin}
  .view.no-tabs{padding-bottom:0}

  @media (prefers-reduced-motion: no-preference){
    .screen-in{animation:rise .32s cubic-bezier(.2,.7,.2,1)}
    @keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
    .tl-step.live .knot{animation:pulse 1.5s ease-in-out infinite}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,96,63,.5)} 50%{box-shadow:0 0 0 9px rgba(240,96,63,0)}}
  }

  /* ---------- type ---------- */
  .eyebrow{font-family:var(--mono); font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-3)}
  .display{font-family:var(--display); font-weight:400; letter-spacing:.005em; text-wrap:balance}
  .serif-i{font-family:var(--display); font-style:italic}
  .mono{font-family:var(--mono)}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- header ---------- */
  .hdr{
    position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--shell) 88%, transparent);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px 12px; border-bottom:1px solid var(--line);
  }
  .wordmark{font-family:var(--display); font-size:21px; letter-spacing:.02em}
  .wordmark em{font-style:italic}
  .hdr .sub{font-family:var(--mono); font-size:9.5px; letter-spacing:.22em; color:var(--ink-3); margin-top:2px; text-transform:uppercase}
  .side-btn{
    font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-2); border:1px solid var(--line); border-radius:999px; padding:7px 12px;
  }
  .side-btn:hover{color:var(--ink); border-color:var(--ink-3)}

  /* ---------- tab bar ---------- */
  .tabs{
    position:absolute; bottom:0; left:0; right:0; z-index:30;
    display:flex; border-top:1px solid var(--line);
    background:color-mix(in srgb, var(--shell) 92%, transparent);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tab{
    flex:1; padding:13px 4px 15px; text-align:center;
    font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-3); position:relative;
  }
  .tab .glyph{display:block; font-family:var(--display); font-size:17px; font-style:italic; margin-bottom:4px; letter-spacing:0}
  .tab.on{color:var(--ink)}
  .tab.on::before{content:""; position:absolute; top:-1px; left:24%; right:24%; height:2px; background:var(--accent)}
  .tab .dot{position:absolute; top:8px; right:22%; width:7px; height:7px; border-radius:50%; background:var(--accent)}

  /* ---------- shared blocks ---------- */
  .pad{padding:20px}
  .stack{display:flex; flex-direction:column; gap:14px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px}
  .rule{height:1px; background:var(--line); border:none}
  .sect{display:flex; align-items:baseline; justify-content:space-between; margin:10px 2px 2px}
  .btn{
    display:block; width:100%; text-align:center; border-radius:14px; padding:15px 18px;
    font-weight:600; font-size:15px; letter-spacing:.01em;
  }
  .btn-hot{background:var(--accent); color:var(--accent-ink)}
  .btn-hot:hover{filter:brightness(1.06)}
  .btn-ghost{border:1px solid var(--line); color:var(--ink)}
  .btn-ghost:hover{border-color:var(--ink-3)}
  .btn[disabled]{opacity:.45; cursor:default}
  .chiprow{display:flex; gap:8px; overflow-x:auto; padding:2px; scrollbar-width:none}
  .chip{
    flex:none; font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    padding:9px 14px; border-radius:999px; border:1px solid var(--line); color:var(--ink-2); white-space:nowrap;
  }
  .chip.on{background:var(--ink); color:var(--shell); border-color:var(--ink)}
  .tag{
    display:inline-block; font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
    border:1px solid var(--line); border-radius:4px; padding:3px 7px; color:var(--ink-2);
  }
  .tag-good{border-color:transparent; background:var(--good-dim); color:var(--good)}
  .tag-hot{border-color:transparent; background:rgba(240,96,63,.14); color:var(--accent)}

  /* included strip */
  .included{background:var(--good-dim); border:1px solid color-mix(in srgb, var(--good) 30%, transparent); border-radius:16px; padding:15px 16px}
  .included h3{font-family:var(--display); font-style:italic; font-weight:400; font-size:18px; margin-bottom:9px}
  .inc-row{display:flex; gap:10px; align-items:baseline; padding:4.5px 0; font-size:13.5px; color:var(--ink-2)}
  .inc-row b{color:var(--ink); font-weight:600}
  .inc-row .ck{color:var(--good); font-family:var(--mono); font-size:12px}

  /* ---------- paint chips / fleet ---------- */
  .fleet-card{display:flex; gap:14px; align-items:stretch; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; width:100%}
  .fleet-card:hover{border-color:var(--ink-3)}
  .swatch{flex:none; width:64px; border-radius:10px; position:relative; min-height:76px}
  .swatch::after{content:""; position:absolute; inset:0; border-radius:10px; box-shadow:inset 0 1px 0 rgba(255,255,255,.25), inset 0 -8px 18px rgba(0,0,0,.25)}
  .fc-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px}
  .fc-name{font-family:var(--display); font-size:17.5px; line-height:1.2}
  .fc-meta{font-family:var(--mono); font-size:10px; letter-spacing:.06em; color:var(--ink-3); text-transform:uppercase}
  .fc-note{font-size:12px; color:var(--accent); margin-top:2px}
  .fc-note.calm{color:var(--ink-2)}
  .fc-price{flex:none; text-align:right; display:flex; flex-direction:column; justify-content:space-between; align-items:flex-end}
  .fc-price .n{font-family:var(--display); font-size:19px}
  .fc-price .per{font-family:var(--mono); font-size:9px; letter-spacing:.12em; color:var(--ink-3); text-transform:uppercase}
  .fc-price .go{font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--accent); text-transform:uppercase}

  .hero-swatch{height:190px; border-radius:18px; position:relative; overflow:hidden}
  .hero-swatch::after{content:""; position:absolute; inset:0; box-shadow:inset 0 2px 0 rgba(255,255,255,.3), inset 0 -30px 60px rgba(0,0,0,.3); border-radius:18px}
  .hero-swatch .lot{
    position:absolute; top:12px; left:12px; font-family:var(--mono); font-size:10px; letter-spacing:.14em;
    background:rgba(0,0,0,.42); color:#F2EDE0; padding:5px 9px; border-radius:5px;
  }
  .hero-swatch .paint{
    position:absolute; bottom:12px; left:12px; font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
    background:rgba(0,0,0,.42); color:#F2EDE0; padding:5px 9px; border-radius:5px;
  }
  .spec-row{display:grid; grid-template-columns:repeat(4,1fr); border:1px solid var(--line); border-radius:14px; overflow:hidden}
  .spec{padding:12px 6px; text-align:center; border-left:1px solid var(--line)}
  .spec:first-child{border-left:none}
  .spec .v{font-family:var(--display); font-size:17px}
  .spec .k{font-family:var(--mono); font-size:8.5px; letter-spacing:.14em; color:var(--ink-3); text-transform:uppercase; margin-top:3px}

  .concierge{border-left:2px solid var(--accent); padding:4px 0 4px 14px; margin:4px 2px}
  .concierge p{font-family:var(--display); font-style:italic; font-size:15.5px; line-height:1.45; color:var(--ink)}
  .concierge .who{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); margin-top:7px}

  /* form bits */
  .frow{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 0; border-bottom:1px solid var(--line)}
  .frow:last-child{border-bottom:none}
  .frow label{font-size:13.5px; color:var(--ink-2)}
  .frow input[type=date]{
    background:var(--card-2); border:1px solid var(--line); border-radius:9px; padding:8px 10px;
    font-family:var(--mono); font-size:12.5px; color-scheme:dark;
  }
  :root[data-theme="light"] .frow input[type=date]{color-scheme:light}
  @media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .frow input[type=date]{color-scheme:light} }
  .step{display:flex; align-items:center; gap:0; border:1px solid var(--line); border-radius:10px; overflow:hidden}
  .step button{padding:8px 14px; font-family:var(--mono); font-size:14px; color:var(--ink-2)}
  .step button:hover{color:var(--ink)}
  .step .val{padding:8px 12px; font-family:var(--mono); font-size:12.5px; border-left:1px solid var(--line); border-right:1px solid var(--line); min-width:70px; text-align:center}
  .seg{display:flex; flex-direction:column; gap:8px}
  .seg-opt{display:flex; justify-content:space-between; align-items:center; gap:10px; border:1px solid var(--line); border-radius:12px; padding:12px 14px; width:100%}
  .seg-opt.on{border-color:var(--accent); background:rgba(240,96,63,.07)}
  .seg-opt .t{font-size:13.5px; font-weight:600}
  .seg-opt .d{font-size:11.5px; color:var(--ink-3); margin-top:2px}
  .seg-opt .p{font-family:var(--mono); font-size:11.5px; color:var(--ink-2)}

  .line-item{display:flex; justify-content:space-between; gap:10px; padding:7px 0; font-size:13.5px; color:var(--ink-2)}
  .line-item .r{font-family:var(--mono); font-size:12.5px; color:var(--ink)}
  .line-item.total{border-top:1px solid var(--line); margin-top:6px; padding-top:12px; color:var(--ink); font-weight:600}
  .line-item .good{color:var(--good)}

  /* tracker */
  .tl{position:relative; padding-left:26px}
  .tl::before{content:""; position:absolute; left:8px; top:10px; bottom:14px; width:1px; background:var(--line)}
  .tl-step{position:relative; padding:0 0 22px}
  .tl-step .knot{position:absolute; left:-26px; top:3px; width:17px; height:17px; border-radius:50%; border:1.5px solid var(--line); background:var(--shell); display:flex; align-items:center; justify-content:center; font-size:9px; color:var(--good)}
  .tl-step.done .knot{border-color:var(--good); background:var(--good-dim)}
  .tl-step.live .knot{border-color:var(--accent); background:var(--accent)}
  .tl-step h4{font-size:14.5px; font-weight:600}
  .tl-step .when{font-family:var(--mono); font-size:10px; color:var(--ink-3); letter-spacing:.08em; margin-top:2px}
  .tl-step .desc{font-size:12.5px; color:var(--ink-2); margin-top:4px; line-height:1.45}
  .tl-step.dim h4{color:var(--ink-3)}

  .msg{background:var(--card-2); border:1px solid var(--line); border-radius:14px 14px 14px 4px; padding:12px 14px; max-width:88%}
  .msg p{font-size:13.5px; line-height:1.5}
  .msg .who{font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); margin-bottom:5px}

  /* partner */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px}
  .stat .v{font-family:var(--display); font-size:24px}
  .stat .k{font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); margin-top:4px}
  .stat .s{font-size:11px; color:var(--ink-2); margin-top:5px; line-height:1.4}
  .tier-bar{height:6px; border-radius:99px; background:var(--card-2); overflow:hidden; margin-top:10px}
  .tier-bar i{display:block; height:100%; background:var(--accent); border-radius:99px}
  .tier-row{display:flex; gap:10px; align-items:baseline; padding:11px 0; border-bottom:1px solid var(--line); font-size:13px}
  .tier-row:last-child{border-bottom:none}
  .tier-row .nm{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; width:64px; flex:none}
  .tier-row .cut{font-family:var(--mono); font-size:12px; flex:none; width:44px; color:var(--ink)}
  .tier-row .pk{color:var(--ink-2); font-size:12px; line-height:1.45}
  .tier-row.you .nm{color:var(--accent)}

  .req-card{border:1px solid var(--line); border-radius:16px; background:var(--card); overflow:hidden}
  .req-head{display:flex; gap:12px; padding:14px 16px; align-items:center}
  .avatar{flex:none; width:38px; height:38px; border-radius:50%; background:var(--card-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:var(--display); font-style:italic; font-size:15px}
  .req-body{padding:0 16px 14px; display:flex; flex-direction:column; gap:8px}
  .req-actions{display:flex; border-top:1px solid var(--line)}
  .req-actions button{flex:1; padding:13px; text-align:center; font-weight:600; font-size:13.5px}
  .req-actions .ok{color:var(--good)}
  .req-actions .no{color:var(--ink-3); border-left:1px solid var(--line)}
  .kv{display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-2)}
  .kv .r{font-family:var(--mono); font-size:11.5px; color:var(--ink)}

  .toggle{flex:none; width:44px; height:26px; border-radius:99px; background:var(--card-2); border:1px solid var(--line); position:relative}
  .toggle i{position:absolute; top:2.5px; left:3px; width:19px; height:19px; border-radius:50%; background:var(--ink-3); transition:transform .18s, background .18s}
  .toggle.on{background:var(--good-dim); border-color:var(--good)}
  .toggle.on i{transform:translateX(18px); background:var(--good)}
  @media (prefers-reduced-motion: reduce){ .toggle i{transition:none} }

  /* gate */
  .gate{min-height:100%; display:flex; flex-direction:column; justify-content:flex-end; padding:28px 24px 34px; position:relative}
  .gate-art{position:absolute; inset:0; overflow:hidden; pointer-events:none}
  .gate-strip{position:absolute; border-radius:99px; opacity:.85}
  .gate-inner{position:relative; display:flex; flex-direction:column; gap:0}
  .gate .wm{font-family:var(--display); font-size:54px; line-height:1.02; letter-spacing:.005em; margin:14px 0 4px}
  .gate .wm em{font-style:italic}
  .gate .lede{font-size:15.5px; line-height:1.55; color:var(--ink-2); max-width:34ch; margin:8px 0 22px}
  .gate .lede b{color:var(--ink); font-weight:600}
  .gate .foot{font-size:11.5px; color:var(--ink-3); line-height:1.55; margin-top:18px; max-width:38ch}

  .toast{
    position:absolute; left:50%; bottom:92px; transform:translateX(-50%);
    background:var(--ink); color:var(--shell); font-size:12.5px; font-weight:600;
    padding:10px 16px; border-radius:99px; z-index:50; white-space:nowrap;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  @media (prefers-reduced-motion: no-preference){
    .toast{animation:toastin .25s cubic-bezier(.2,.7,.2,1)}
    @keyframes toastin{from{opacity:0; transform:translate(-50%,8px)} to{opacity:1; transform:translate(-50%,0)}}
  }

  .ig-card{background:linear-gradient(150deg, var(--card) 0%, var(--card-2) 100%); border:1px solid var(--line); border-radius:16px; padding:16px}
  .route{display:flex; gap:12px; padding:13px 2px; border-bottom:1px solid var(--line); align-items:baseline}
  .route:last-child{border-bottom:none}
  .route .rd{flex:none; font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--accent); width:74px; text-transform:uppercase}
  .route .rt{font-size:13.5px; font-weight:600}
  .route .rs{font-size:12px; color:var(--ink-2); margin-top:3px; line-height:1.45}

  .code-box{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    border:1.5px dashed var(--ink-3); border-radius:12px; padding:13px 16px; margin-top:12px;
  }
  .code-box .c{font-family:var(--mono); font-size:15px; letter-spacing:.14em}
  .code-box button{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent)}

  .list-row{display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; align-items:baseline}
  .list-row:last-child{border-bottom:none}
  .pay-row{display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:12px 0; border-bottom:1px solid var(--line)}
  .pay-row:last-child{border-bottom:none}
</style>

<div class="shell" id="shell"></div>

<script>
"use strict";

/* ---------------- data ---------------- */

const CARS = [
  {id:"hur", name:"Lamborghini Huracán EVO", year:2023, paint:{name:"Verde Mantis", hex:"#3FA33C", hi:"#8FE07F"},
   city:"Miami", rate:899, hp:631, zero60:"2.9", seats:2, deposit:1000, lot:"TN-07",
   note:"3 requests this week", hot:true, owner:"marcus", ownerTime:"~45 min",
   cnote:"Weekend nights on this one go first. If you want Saturday, ask by Thursday — the owner is quick but the calendar isn't."},
  {id:"urus", name:"Lamborghini Urus", year:2024, paint:{name:"Giallo Auge", hex:"#E7B426", hi:"#FFE38A"},
   city:"Miami", rate:749, hp:657, zero60:"3.1", seats:5, deposit:1000, lot:"TN-11",
   note:"Fits the whole crew + luggage", hot:false, owner:"elena", ownerTime:"~1 hr",
   cnote:"The airport-run favorite. Seats five, swallows luggage, still turns every head on Collins."},
  {id:"f8", name:"Ferrari F8 Tributo", year:2022, paint:{name:"Rosso Corsa", hex:"#C4231C", hi:"#F2755F"},
   city:"Miami", rate:999, hp:710, zero60:"2.9", seats:2, deposit:1500, lot:"TN-02",
   note:"2 requests this week", hot:true, owner:"elena", ownerTime:"~2 hrs",
   cnote:"Our most-photographed car. If the trip is a birthday or a proposal, tell us — we'll time delivery to the minute."},
  {id:"mcl", name:"McLaren 570S Spider", year:2021, paint:{name:"Vega Blue", hex:"#2A6BD4", hi:"#7FB2FF"},
   city:"Fort Lauderdale", rate:799, hp:562, zero60:"3.1", seats:2, deposit:1000, lot:"TN-15",

/* ---------------- helpers ---------------- */

function toast(msg){
  S.toastMsg = msg;
  clearTimeout(S.toastTimer);
  S.toastTimer = setTimeout(()=>{ S.toastMsg=null; render(); }, 2400);
  render();
}

function clearTimers(){ S.timers.forEach(clearTimeout); S.timers=[]; }

function swatchStyle(p, hero){
  return `background:
    radial-gradient(${hero?"120% 90% at 28% 0%":"150% 110% at 30% 0%"}, ${p.hi}55, transparent 46%),
    linear-gradient(160deg, ${p.hi}33 0%, ${p.hex} 52%, color-mix(in srgb, ${p.hex} 62%, black) 100%);`;
}

function deliveryLabel(k){
  return k==="pickup" ? "Pickup — Miami / FLL / PBI lot" : k==="hotel" ? "Hotel delivery" : "Residence delivery";
}
function deliveryFee(k, days){ return k==="pickup" ? 0 : (days>=3 ? 0 : 149); }

/* ---------------- request lifecycle ---------------- */

function submitRequest(carId){
  clearTimers();
  const c = car(carId);
  const start = S.form.start || addDays(today(),1);
  const req = {
    id:"my"+Date.now(), carId, mine:true, renter:"You", renterTrips:2,
    start, days:S.form.days, delivery:S.form.delivery,
    status:"sent", sentAt:new Date(), msgs:[
      {who:"V. — TopNotch concierge", text:"Got it. Your request is in — I'm reaching out to the owner right now. You haven't been charged anything yet."}
    ],
  };
  S.myReq = req;
  S.requests.unshift(req);
  S.screen = {kind:"tracker"};
  render();

  S.timers.push(setTimeout(()=>{
    if(req.status!=="sent") return;
    req.status="confirming";
    req.msgs.push({who:"V. — TopNotch concierge", text:"On with the owner now. This one usually comes back fast — I'll ping you the second it's locked."});
    render();
  }, 2400));
  S.timers.push(setTimeout(()=>{
    if(req.status!=="confirming") return;
    confirmMyRequest("Owner said yes. You're locked — "+c.name+", "+fdate(req.start)+"–"+fdate(addDays(req.start,req.days))+". Insurance is on, the deposit holds the day before and comes back after return. See you out there.");
  }, 9500));
}

function confirmMyRequest(msgText){
  const req = S.myReq; if(!req || req.status==="confirmed") return;
  clearTimers();
  req.status="confirmed"; req.confirmedAt=new Date();
  req.msgs.push({who:"V. — TopNotch concierge", text:msgText});
  S.trips.unshift({ id:"t"+Date.now(), carId:req.carId, start:req.start, days:req.days,
    delivery:req.delivery, status:"confirmed", depositState:"Holds the day before pickup" });
  render();
}

function partnerDecide(id, ok){
  const req = S.requests.find(r=>r.id===id); if(!req) return;
  if(req.mine){
    if(ok){
      confirmMyRequest("Owner said yes. You're locked — "+car(req.carId).name+". Insurance is on, the deposit holds the day before and comes back after return. See you out there.");
      toast("Approved — the renter just got the good news");
    } else {
      clearTimers(); req.status="declined";
      req.msgs.push({who:"V. — TopNotch concierge", text:"Bad news — the owner can't make those dates work. Nothing was charged. Want me to line up something close? The "+ (req.carId==="hur"?"F8 Tributo":"Huracán EVO") +" is open that weekend."});
      toast("Declined — renter was never charged");
    }
  } else {
    req.status = ok ? "confirmed" : "declined";
    toast(ok ? "Confirmed — trip is on the books" : "Declined — renter was never charged");
  }
  render();
}

    <div class="stat-grid">

      <div class="stat"><div class="v num">${p.trips}</div><div class="k">Trips this month</div><div class="s">Across ${p.listings.filter(l=>l.live).length} live cars</div></div>

      <div style="display:flex; justify-content:space-between; align-items:baseline">

      <div class="tier-row you"><span class="nm">Gold ◆</span><span class="cut num">78%</span><span class="pk">Priority placement, direct concierge line, pro photos comped.</span></div>
      <div class="tier-row"><span class="nm">Black</span><span class="cut num">84%</span><span class="pk">First call on concierge requests, co-branded features with @305.pluggedin.</span></div>
    </div>

/* ---------------- partner: requests ---------------- */

function pReqsHTML(){
  const active = S.requests.filter(r=>["sent","confirming","pending_owner"].includes(r.status));
  const settled = S.requests.filter(r=>["confirmed","declined"].includes(r.status));
  const reqCard = r => {
    const c = car(r.carId);
    const gross = c.rate*r.days;
    const cut = Math.round(gross*S.partner.cut);
    const open = ["sent","confirming","pending_owner"].includes(r.status);
    return `
    <div class="req-card">
      <div class="req-head">
        <span class="avatar">${r.renter[0]}</span>
        <div style="flex:1">
          <div style="font-size:14px; font-weight:600">${r.renter} ${r.mine?`<span class="tag tag-hot" style="margin-left:4px">Live demo — this is your request</span>`:""}</div>
          <div class="mono" style="font-size:10px; color:var(--ink-3); margin-top:3px">ID verified · ${r.renterTrips} TopNotch trips · 0 incidents</div>
        </div>
        ${open?`<span class="tag">${r.status==="pending_owner"?"Waiting":"New"}</span>`
             :`<span class="tag ${r.status==="confirmed"?"tag-good":""}">${r.status==="confirmed"?"Confirmed":"Declined"}</span>`}
      </div>
      <div class="req-body">
        <div class="kv"><span>Car</span><span class="r">${c.name}</span></div>
        <div class="kv"><span>Dates</span><span class="r">${fdate(r.start)} – ${fdate(addDays(r.start,r.days))} (${r.days}d)</span></div>
        <div class="kv"><span>Handoff</span><span class="r">${deliveryLabel(r.delivery)}</span></div>
        ${r.note?`<div class="kv"><span>Note</span><span class="r">${r.note}</span></div>`:""}
        <div class="kv"><span>Your payout (${Math.round(S.partner.cut*100)}%)</span><span class="r good" style="color:var(--good)">${fmt(cut)}</span></div>
      </div>
      ${open?`
      <div class="req-actions">
        <button class="ok" data-act="approve" data-id="${r.id}">Approve — ${fmt(cut)}</button>
        <button class="no" data-act="decline" data-id="${r.id}">Can't make it</button>
      </div>`:""}
    </div>`;
  };
  return `
  <div class="pad stack screen-in">
    <div class="sect"><span class="eyebrow">Waiting on you</span><span class="mono" style="font-size:10px; color:var(--ink-3)">${active.length} open</span></div>
    ${active.length?active.map(reqCard).join(""):`<p style="font-size:13px; color:var(--ink-3)">Nothing pending. New requests land here the moment a renter asks.</p>`}
    <p style="font-size:11.5px; color:var(--ink-3); line-height:1.6">
      Renters are never charged until you approve. Decline anytime — no penalty, but your
      response time feeds your fleet ranking.
    </p>
    ${settled.length?`
    <div class="sect"><span class="eyebrow">Settled</span></div>
    ${settled.map(reqCard).join("")}`:""}
  </div>`;
}

      <p style="font-size:12px; color:var(--ink-2); margin-top:7px">Direct deposit. No minimums, no holding period, no “wallet.”</p>

        <div><div style="font-size:13.5px; font-weight:600">${x.what}</div><div class="mono" style="font-size:10px; color:var(--ink-3); margin-top:3px">${x.when}</div></div>

        Renter pays the listed price. TopNotch covers insurance, vetting, concierge and delivery

function cutOfConfirmed(){
  return S.requests
    .filter(r=>r.status==="confirmed")
    .reduce((a,r)=>a+Math.round(car(r.carId).rate*r.days*S.partner.cut), 0);
}

/* ---------------- render ---------------- */

const R_TABS = [
  {id:"fleet", l:"Fleet", g:"F"},
  {id:"trips", l:"Trips", g:"T"},
  {id:"list", l:"The List", g:"L"},
];
const P_TABS = [
  {id:"today", l:"Today", g:"T"},
  {id:"reqs", l:"Requests", g:"R"},
  {id:"garage", l:"Garage", g:"G"},
  {id:"earn", l:"Earnings", g:"E"},
];

function render(){
  const shell = document.getElementById("shell");
  let html = "";

  if(S.mode==="gate"){
    html = gateHTML();
  } else if(S.mode==="renter"){
    let body;
    if(S.screen && S.screen.kind==="car") body = carHTML(S.screen.id);
    else if(S.screen && S.screen.kind==="tracker") body = trackerHTML();
    else body = {fleet:fleetHTML, trips:tripsHTML, list:listHTML}[S.rTab]();
    const liveReq = S.myReq && !["confirmed","declined"].includes(S.myReq.status);
    html =
      headerHTML("Rentals · South Florida", "Partner side ⇄", "toPartner") +
      `<div class="view" id="view">${body}</div>` +
      tabsHTML(R_TABS, S.screen?null:S.rTab, "rTab", liveReq?"trips":null);
  } else {
    const body = {today:pTodayHTML, reqs:pReqsHTML, garage:pGarageHTML, earn:pEarnHTML}[S.pTab]();
    const pending = S.requests.some(r=>["sent","confirming","pending_owner"].includes(r.status));
    html =
      headerHTML("Fleet partner · Marcus R.", "Renter side ⇄", "toRenter") +
      `<div class="view" id="view">${body}</div>` +
      tabsHTML(P_TABS, S.pTab, "pTab", pending?"reqs":null);
  }

  if(S.toastMsg) html += `<div class="toast" role="status">${S.toastMsg}</div>`;
  shell.innerHTML = html;
}

/* ---------------- events ---------------- */

document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  const scrollTop = ()=>{ const v=document.getElementById("view"); if(v) v.scrollTop=0; };

  switch(act){
    case "enterRenter": S.mode="renter"; S.rTab="fleet"; S.screen=null; render(); break;
    case "enterPartner": S.mode="partner"; S.pTab="today"; render(); break;
    case "toPartner": S.mode="partner"; render(); break;
    case "toRenter": S.mode="renter"; render(); break;
    case "rTab": S.rTab=id; S.screen=null; render(); scrollTop(); break;
    case "pTab": S.pTab=id; render(); scrollTop(); break;
    case "setCity": S.city=id; render(); break;
    case "openCar":
      S.mode="renter"; S.screen={kind:"car", id};
      S.form={start:addDays(today(),1), days:2, delivery:"pickup"};
      render(); scrollTop(); break;
    case "backFleet": S.screen=null; S.rTab="fleet"; render(); scrollTop(); break;
    case "goTrips": S.screen=null; S.rTab="trips"; render(); scrollTop(); break;
    case "openTracker": S.screen={kind:"tracker"}; render(); scrollTop(); break;
    case "daysDec": S.form.days=Math.max(1,S.form.days-1); render(); break;
    case "daysInc": S.form.days=Math.min(14,S.form.days+1); render(); break;
    case "setDelivery": S.form.delivery=id; render(); break;
    case "submitRequest": submitRequest(id); scrollTop(); break;
    case "approve": partnerDecide(id,true); break;
    case "decline": partnerDecide(id,false); break;
    case "toggleListing": {
      const l=S.partner.listings.find(x=>x.carId===id);
      if(l){ l.live=!l.live; toast(l.live?"Taking requests again":"Paused — no tier penalty"); }
      break;
    }
    case "copyCode":
      (navigator.clipboard ? navigator.clipboard.writeText("TN-ALX-305") : Promise.reject())
        .then(()=>toast("Code copied — worth $75 to a friend"))
        .catch(()=>toast("Your code: TN-ALX-305"));
      break;
    case "scoutToast": toast("We'll text you an intro link — check your messages"); break;
    case "igToast": toast("Opens @305.pluggedin on Instagram"); break;
    case "addCarToast": toast("Spec sheet form sent to your email"); break;
  }
});

document.addEventListener("change", e=>{
  if(e.target.id==="startdate" && e.target.value){
    const [y,m,d] = e.target.value.split("-").map(Number);
    S.form.start = new Date(y, m-1, d);
  }
});

render();
</script>
