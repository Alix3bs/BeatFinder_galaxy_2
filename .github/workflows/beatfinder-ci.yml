name: BeatFinder CI

on:
  push:
    branches:
      - beatfinder-system-v1
  pull_request:
    branches:
      - beatfinder-system-v1
  workflow_dispatch:

concurrency:
  group: beatfinder-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, tests, eval, and local smoke
    runs-on: macos-latest
    env:
      BEATFINDER_SUPABASE_MODE: local
      BEATFINDER_STATE_DIR: ${{ runner.temp }}/beatfinder_state
      PORT: "8787"
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/beatfinder_pycache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Export local runtime paths
        run: |
          echo "BEATFINDER_PYTHON_BIN=$(command -v python3)" >> "$GITHUB_ENV"
          echo "BEATFINDER_NODE_BIN=$(command -v node)" >> "$GITHUB_ENV"

      - name: Backend lint
        run: |
          set -euo pipefail
          echo "Running: python3 scripts/dev/lint.py"
          python3 scripts/dev/lint.py

      - name: Backend unit tests
        run: |
          set -euo pipefail
          echo "Running: python3 -m unittest discover -s backend/tests -p 'test_*.py' -v"
          python3 -m unittest discover -s backend/tests -p 'test_*.py' -v

      - name: Backend fixture evaluation
        run: |
          set -euo pipefail
          echo "Running: python3 scripts/eval/run_eval.py"
          python3 scripts/eval/run_eval.py

      - name: Local API smoke test
        run: |
          set -euo pipefail

          python3 scripts/ingest/load_fixtures.py
          python3 scripts/discovery/load_producer_seeds.py
          python3 scripts/discovery/load_mock_youtube_backfill.py

          bash scripts/dev/start_local.sh > "$RUNNER_TEMP/beatfinder-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          healthy=0
          for attempt in {1..30}; do
            if curl -fsS "http://127.0.0.1:${PORT}/health"; then
              healthy=1
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/beatfinder-api.log"
              echo "BeatFinder API exited before becoming healthy."
              exit 1
            fi
            sleep 1
          done

          if [ "$healthy" -ne 1 ]; then
            cat "$RUNNER_TEMP/beatfinder-api.log"
            echo "BeatFinder API did not become healthy before timeout."
            exit 1
          fi

          curl -fsS -X POST "http://127.0.0.1:${PORT}/search/text" \
            -H 'Content-Type: application/json' \
            -d '{"query":"sza x summer walker type beat","detected_producer_tag":"prod by salishan","top_n":3}' \
            > "$RUNNER_TEMP/beatfinder-search.json"

          python3 - "$RUNNER_TEMP/beatfinder-search.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          discovery = payload.get("discovery") or {}
          status = discovery.get("discovery_status")
          title = (discovery.get("youtube_video_match") or {}).get("title")
          if status != "found_candidate":
              print(json.dumps(discovery, indent=2, sort_keys=True))
              raise SystemExit(f"Expected discovery_status found_candidate, got {status!r}")
          if title != "SZA x Summer Walker Type Beat - Late Nights":
              print(json.dumps(discovery, indent=2, sort_keys=True))
              raise SystemExit(f"Expected matching YouTube fixture title, got {title!r}")
          print("discovery_status=found_candidate")
          print(f"youtube_video_match.title={title}")
          PY

  ios:
    name: iOS project checks and simulator build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print Xcode version
        run: |
          xcode-select -p
          xcodebuild -version

      - name: List Xcode schemes
        run: |
          set -euo pipefail
          echo "Running: xcodebuild -list -project BeatFinder.xcodeproj"
          xcodebuild -list -project BeatFinder.xcodeproj

      - name: Project file lint
        run: |
          set -euo pipefail
          echo "Running: plutil -lint BeatFinder.xcodeproj/project.pbxproj"
          plutil -lint BeatFinder.xcodeproj/project.pbxproj

      - name: Swift API contract typecheck
        run: |
          set -euo pipefail
          echo "Running Swift API contract typecheck"
          swiftc \
            -module-cache-path "$RUNNER_TEMP/beatfinder-swift-module-cache" \
            -typecheck \
            BeatFinder/BeatFinderAPIModels.swift \
            BeatFinder/BeatFinderAPIClient.swift \
            BeatFinder/BeatFinderBackendTestViewModel.swift

      - name: Select available iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          xcrun simctl list devices available -j > "$RUNNER_TEMP/available-simulators.json"

          python3 - "$RUNNER_TEMP/available-simulators.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          simulator_json_path = sys.argv[1]
          github_output_path = sys.argv[2]
          preferred_names = ["iPhone 16", "iPhone 15", "iPhone 14"]

          with open(simulator_json_path, "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          devices = []
          for runtime_devices in payload.get("devices", {}).values():
              for device in runtime_devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      devices.append(device)

          selected = None
          for preferred_name in preferred_names:
              selected = next((device for device in devices if device.get("name") == preferred_name), None)
              if selected:
                  break

          if selected is None and devices:
              selected = devices[0]

          if selected is None:
              raise SystemExit("No available iPhone simulator found.")

          name = selected["name"]
          udid = selected["udid"]
          print(f"Selected simulator: {name} ({udid})")
          with open(github_output_path, "a", encoding="utf-8") as handle:
              handle.write(f"name={name}\n")
              handle.write(f"udid={udid}\n")
          PY

      - name: Build BeatFinder for iOS simulator
        run: |
          set -euo pipefail
          destination="platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}"

          echo "Selected simulator: ${{ steps.simulator.outputs.name }} (${{ steps.simulator.outputs.udid }})"
          echo "Running xcodebuild with destination: $destination"
          echo "Command:"
          echo "xcodebuild -project BeatFinder.xcodeproj -scheme BeatFinder -destination \"$destination\" -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=\"\" build"

          if ! xcodebuild \
            -project BeatFinder.xcodeproj \
            -scheme BeatFinder \
            -destination "$destination" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/beatfinder-xcodebuild.log"; then
            echo "::error::BeatFinder simulator build failed. Showing last 200 log lines."
            tail -200 "$RUNNER_TEMP/beatfinder-xcodebuild.log"
            exit 1
          fi
