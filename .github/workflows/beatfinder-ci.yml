name: BeatFinder CI

on:
  push:
    branches:
      - beatfinder-system-v1
      - "claude/**"
  pull_request:
    branches:
      - beatfinder-system-v1
  workflow_dispatch:

concurrency:
  group: beatfinder-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, tests, eval, and local smoke
    runs-on: macos-latest
    env:
      BEATFINDER_SUPABASE_MODE: local
      PORT: "8787"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Export local runtime paths
        run: |
          echo "BEATFINDER_PYTHON_BIN=$(command -v python3)" >> "$GITHUB_ENV"
          echo "BEATFINDER_NODE_BIN=$(command -v node)" >> "$GITHUB_ENV"
          echo "BEATFINDER_STATE_DIR=$RUNNER_TEMP/beatfinder_state" >> "$GITHUB_ENV"
          echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/beatfinder_pycache" >> "$GITHUB_ENV"

      - name: Backend lint
        run: |
          set -euo pipefail
          echo "Running: python3 scripts/dev/lint.py"
          python3 scripts/dev/lint.py

      - name: Backend unit tests
        run: |
          set -euo pipefail
          echo "Running: python3 -m unittest discover -s backend/tests -p 'test_*.py' -v"
          python3 -m unittest discover -s backend/tests -p 'test_*.py' -v

      - name: Backend fixture evaluation
        run: |
          set -euo pipefail
          echo "Running: python3 scripts/eval/run_eval.py"
          python3 scripts/eval/run_eval.py

      - name: Local API smoke test
        run: |
          set -euo pipefail

          python3 scripts/ingest/load_fixtures.py
          python3 scripts/discovery/load_producer_seeds.py
          python3 scripts/discovery/load_mock_youtube_backfill.py

          bash scripts/dev/start_local.sh > "$RUNNER_TEMP/beatfinder-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          healthy=0
          for attempt in {1..30}; do
            if curl -fsS "http://127.0.0.1:${PORT}/health"; then
              healthy=1
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/beatfinder-api.log"
              echo "BeatFinder API exited before becoming healthy."
              exit 1
            fi
            sleep 1
          done

          if [ "$healthy" -ne 1 ]; then
            cat "$RUNNER_TEMP/beatfinder-api.log"
            echo "BeatFinder API did not become healthy before timeout."
            exit 1
          fi

          curl -fsS -X POST "http://127.0.0.1:${PORT}/search/text" \
            -H 'Content-Type: application/json' \
            -d '{"query":"sza x summer walker type beat","detected_producer_tag":"prod by salishan","top_n":3}' \
            > "$RUNNER_TEMP/beatfinder-search.json"

          python3 - "$RUNNER_TEMP/beatfinder-search.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          discovery = payload.get("discovery") or {}
          status = discovery.get("discovery_status")
          title = (discovery.get("youtube_video_match") or {}).get("title")
          if status != "found_candidate":
              print(json.dumps(discovery, indent=2, sort_keys=True))
              raise SystemExit(f"Expected discovery_status found_candidate, got {status!r}")
          if title != "SZA x Summer Walker Type Beat - Late Nights":
              print(json.dumps(discovery, indent=2, sort_keys=True))
              raise SystemExit(f"Expected matching YouTube fixture title, got {title!r}")
          print("discovery_status=found_candidate")
          print(f"youtube_video_match.title={title}")
          PY

  ios:
    name: iOS project checks and simulator build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print Xcode version
        run: |
          xcode-select -p
          xcodebuild -version

      - name: List Xcode schemes
        run: |
          set -euo pipefail
          echo "Running: xcodebuild -list -project BeatFinder.xcodeproj"
          xcodebuild -list -project BeatFinder.xcodeproj

      - name: Project file lint
        run: |
          set -euo pipefail
          echo "Running: plutil -lint BeatFinder.xcodeproj/project.pbxproj"
          plutil -lint BeatFinder.xcodeproj/project.pbxproj

      - name: Swift API contract typecheck
        run: |
          set -euo pipefail
          echo "Running Swift API contract typecheck"
          swiftc \
            -module-cache-path "$RUNNER_TEMP/beatfinder-swift-module-cache" \
            -typecheck \
            BeatFinder/BeatFinderAPIModels.swift \
            BeatFinder/BeatFinderAPIClient.swift \
            BeatFinder/BeatFinderBackendTestViewModel.swift

      - name: List available iOS simulators
        run: |
          set -euo pipefail
          echo "Available simulator devices for diagnostics:"
          xcrun simctl list devices available

      - name: Build BeatFinder for generic iOS simulator
        run: |
          set -euo pipefail
          log_path="$RUNNER_TEMP/beatfinder-xcodebuild.log"
          result_bundle_path="$RUNNER_TEMP/BeatFinderBuild.xcresult"
          derived_data_path="$RUNNER_TEMP/BeatFinderDerivedData"
          destination="generic/platform=iOS Simulator"

          rm -rf "$result_bundle_path" "$derived_data_path"

          echo "Running xcodebuild with destination: $destination"
          echo "Command:"
          echo "xcodebuild -project BeatFinder.xcodeproj -scheme BeatFinder -destination '$destination' -sdk iphonesimulator -derivedDataPath \"$derived_data_path\" -resultBundlePath \"$result_bundle_path\" -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=\"\" build"

          if ! xcodebuild \
            -project BeatFinder.xcodeproj \
            -scheme BeatFinder \
            -destination "$destination" \
            -sdk iphonesimulator \
            -derivedDataPath "$derived_data_path" \
            -resultBundlePath "$result_bundle_path" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$log_path"; then
            echo "::error::BeatFinder simulator build failed. Showing last 300 log lines."
            tail -300 "$log_path" || true
            echo "::group::Focused xcodebuild failure lines"
            grep -E -i "error:|BUILD FAILED|Unable to find a destination|No such module|cannot find|Provisioning|Signing" "$log_path" || true
            echo "::endgroup::"
            exit 1
          fi

      - name: Upload xcodebuild failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: beatfinder-xcodebuild-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/beatfinder-xcodebuild.log
            ${{ runner.temp }}/BeatFinderBuild.xcresult
          if-no-files-found: ignore

  container:
    name: Backend container build and health check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t beatfinder-backend .

      - name: Run container and verify health and search
        run: |
          set -euo pipefail
          docker run -d --name beatfinder -p 8787:8787 beatfinder-backend

          healthy=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            docker logs beatfinder
            echo "Container did not become healthy."
            exit 1
          fi

          curl -fsS http://127.0.0.1:8787/health | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          assert payload["status"] == "ok", payload
          assert payload["storage_mode"] == "local", payload
          print("health ok:", payload["storage_mode"])
          '

          docker stop beatfinder

      - name: Show container logs on failure
        if: failure()
        run: docker logs beatfinder || true

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run gitleaks over the working tree
        run: |
          set -euo pipefail
          curl -sSfL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --no-git --source . --config .gitleaks.toml --redact --verbose

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
