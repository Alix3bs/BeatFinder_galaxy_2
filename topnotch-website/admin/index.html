<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TopNotchRentalz — Operations</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="admin.css">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M10,14 H90 V36 H62 C61,60 63,74 76,88 H24 C37,74 39,60 38,36 H10 Z" fill="%23ff6a00"/></svg>'>
</head>
<body data-no-float>

<!-- ===== login (real authentication — verified by the server) ===== -->
<div class="gate" id="gate" hidden>
  <div class="gate-card">
    <img src="../img/logo-topnotch.png" alt="TOPNOTCH" style="height:22px;margin:0 auto 8px">
    <p class="gate-sub" id="gateSub">Operations Dashboard — team sign in</p>
    <div id="loginForm">
      <input class="f-input" id="loginEmail" type="email" placeholder="Work email" autocomplete="username" style="margin-bottom:10px">
      <input class="f-input" id="loginPass" type="password" placeholder="Password" autocomplete="current-password">
      <button class="btn btn-primary btn-block" id="loginBtn" style="margin-top:14px">Sign In</button>
      <p class="fineprint" style="text-align:center"><a href="#" id="forgotLink" style="color:var(--orange)">Forgot password?</a></p>
    </div>
    <div id="resetForm" hidden>
      <input class="f-input" id="resetEmail" type="email" placeholder="Work email">
      <button class="btn btn-primary btn-block" id="resetBtn" style="margin-top:14px">Email Reset Link</button>
      <p class="fineprint" style="text-align:center"><a href="#" id="backToLogin" style="color:var(--orange)">Back to sign in</a></p>
    </div>
    <div id="newPassForm" hidden>
      <p class="gate-sub">Set a new password (min 10 characters)</p>
      <input class="f-input" id="npCurrent" type="password" placeholder="Temporary / current password" style="margin-bottom:10px">
      <input class="f-input" id="npNext" type="password" placeholder="New password">
      <button class="btn btn-primary btn-block" id="npBtn" style="margin-top:14px">Save Password</button>
    </div>
    <p class="fineprint" id="gateMsg" style="text-align:center"></p>
  </div>
</div>

<!-- ===== app ===== -->
<div class="admin" id="app" hidden>
  <aside class="side">
    <div class="side-brand">
      <img src="../img/logo-t.png" alt="" width="26">
      <img src="../img/logo-topnotch.png" alt="TOPNOTCH" style="height:12px">
    </div>
    <nav class="side-nav" id="sideNav">
      <button class="on" data-tab="dash">Dashboard</button>
      <button data-tab="requests" data-roles="admin,sales,cx,ops">Requests <span class="pill-count" id="reqCount"></span></button>
      <button data-tab="inventory" data-roles="admin,partnerships,ops">Inventory</button>
      <button data-tab="partners" data-roles="admin,partnerships">Partners</button>
      <button data-tab="rentals" data-roles="admin,ops">Active Rentals</button>
      <button data-tab="import" data-roles="admin,partnerships">Import Fleet</button>
      <button data-tab="sync" data-roles="admin">Excel Sync</button>
      <button data-tab="audit" data-roles="admin">Audit Log</button>
      <button data-tab="users" data-roles="admin">Team</button>
    </nav>
    <div class="side-foot">
      <div class="fineprint" id="whoami" style="margin-bottom:8px"></div>
      <a class="btn btn-ghost btn-sm btn-block" href="../index.html">View Site</a>
      <button class="btn btn-ghost btn-sm btn-block" id="logoutBtn" style="margin-top:8px">Sign Out</button>
    </div>
  </aside>

  <main class="main">
    <section class="tab" id="tab-dash"></section>
    <section class="tab" id="tab-requests" hidden></section>
    <section class="tab" id="tab-inventory" hidden></section>
    <section class="tab" id="tab-partners" hidden></section>
    <section class="tab" id="tab-rentals" hidden></section>
    <section class="tab" id="tab-import" hidden></section>
    <section class="tab" id="tab-sync" hidden></section>
    <section class="tab" id="tab-audit" hidden></section>
    <section class="tab" id="tab-users" hidden></section>
  </main>
</div>

<div id="modalRoot"></div>
<script src="admin.js"></script>
</body>
</html>
